name: catalog-import

on:
  workflow_dispatch:
    inputs:
      game:
        description: Gioco da aggiornare
        type: choice
        options: [fab, pokemon]
        default: fab
  # Controllo settimanale di nuove espansioni (lunedì alle 05:00 UTC).
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: write

concurrency:
  group: catalog-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      # Un gioco alla volta: ogni job aggiorna catalog/manifest.json.
      max-parallel: 1
      fail-fast: false
      matrix:
        game: ${{ github.event_name == 'schedule' && fromJSON('["fab","pokemon"]') || fromJSON(format('["{0}"]', inputs.game)) }}
    defaults:
      run:
        working-directory: tools/catalog-import
    steps:
      - uses: actions/checkout@v4
        with:
          # Sempre l'ultimo main: il job precedente della matrice potrebbe aver appena pubblicato.
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/catalog-import/package-lock.json

      - run: npm ci
      # Sempre l'ultima versione dei dati FaB: è così che arrivano le nuove espansioni.
      - if: matrix.game == 'fab'
        run: npm install --no-save @flesh-and-blood/cards@latest @flesh-and-blood/types@latest
      - run: npm test

      - name: Import
        run: node src/main.ts --game ${{ matrix.game }}

      - name: Pubblica le modifiche
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog images tools/catalog-import/state
          if git diff --cached --quiet; then
            echo "Nessuna novità da pubblicare."
          else
            git commit -m "Catalogo ${{ matrix.game }} aggiornato ($(jq -r '.games["${{ matrix.game }}"].source' catalog/manifest.json))"
            git push
          fi
